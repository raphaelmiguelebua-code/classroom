@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--sf:#131a2e;--ink:#e8ecf7;--mu:#a3adc7;--ln:#26304d;--ac:#8b87ff;--ai:#0b1020;--sh:#1b2347;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;color-scheme:dark}}

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}

:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);margin:4px 0 10px}
label{font-weight:500;font-size:13px;display:block}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{background:var(--sf);border-right:1px solid var(--ln);padding:16px 12px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto}
.side .nav{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--mu);font-weight:500}
.side .nav:hover,.side .nav[aria-current=page]{background:var(--sh);color:var(--ink)}
main{padding:24px;max-width:960px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mu);font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;border:1px solid currentColor;font-size:12px;font-weight:600}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}.mu{color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}

.auth{max-width:380px;margin:8vh auto;padding:0 16px}
.qn{width:36px;height:36px;padding:0}.qn.a{background:var(--sh);border-color:var(--ac)}.qn.c{outline:2px solid var(--ac)}
.opt{display:flex;align-items:flex-start;padding:10px;border:1px solid var(--ln);border-radius:8px;margin:6px 0;cursor:pointer;font-weight:400;font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700}

#modal.on{display:flex}#modal .card{max-width:440px;width:100%;margin:0}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.7;transition:opacity .6s}
#app{position:relative;z-index:1}.app,main{background:transparent}
.side{background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(8px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{50%{opacity:.5;transform:scale(1.07)}}
@keyframes flt{50%{transform:translateY(-6px)}}
.fx>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards}.fx>*:nth-child(2){animation-delay:.07s}.fx>*:nth-child(3){animation-delay:.14s}.fx>*:nth-child(n+4){animation-delay:.2s}
.card{transition:transform .2s,box-shadow .2s,border-color .2s}.card:not(form):hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(79,70,229,.16);border-color:var(--ac)}
.btn{transition:transform .15s,border-color .15s,filter .15s}.btn:active{transform:scale(.96)}.pri:hover{filter:brightness(1.12)}
.opt{transition:border-color .15s,background .15s}.opt:hover,.opt:has(input:checked){border-color:var(--ac);background:var(--sh)}
#modal.on .card{animation:pop .25s}#toast{animation:tin .3s}.timer.urgent{color:var(--er);animation:pulse 1s infinite}
.logo{display:inline-block;animation:flt 3.5s ease-in-out infinite}.dbs{font-size:12px;display:inline-flex;gap:6px;align-items:center}.dbs i{width:8px;height:8px;border-radius:50%;background:currentColor}

 <div class="card row sp"><span><b>Teacher invite code:</b> <span class="badge">${esc(D.cfg.find(c=>c.id==='invite')?.code||'')}</span><br><span class="mu">Teachers can sign up themselves with this code. You can also create teacher accounts under Accounts.</span></span><button class="btn" data-act="newinv">New code</button></div>
 <form class="card" data-form="mypw"><h2>Change your password</h2><label>New password<input name="p" type="password" minlength="6" required autocomplete="new-password"></label><button class="btn pri">Update password</button></form>`}
 return`<h1>Accounts</h1><form class="card" data-form="mkteacher"><h2>Create a teacher account</h2><div class="row"><label style="flex:1">Full name<input name="name" required maxlength="60"></label><label style="flex:1">Username<input name="u" required maxlength="30"></label><label style="flex:1">Temporary password<input name="p" type="password" minlength="6" required></label></div><button class="btn pri">Create teacher</button></form>
 <div class="card"><div class="tw"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr>${D.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.u)}</td><td>${esc(u.role)}</td><td>${badge(u.on===false?['Disabled','er']:['Active','ok'])}</td><td>${u.id===me?'<span class="mu">You</span>':`<div class="row"><button class="btn" data-act="tog" data-id="${u.id}">${u.on===false?'Enable':'Disable'}</button><button class="btn" data-act="rp" data-id="${u.id}">Reset password</button><button class="btn dan" data-act="deluser" data-id="${u.id}">Delete</button></div>`}</td></tr>`).join('')}</table></div></div>`}
function examList(){return`<div class="row sp"><h1>Exams</h1><button class="btn pri" data-act="newexam">New exam</button></div>${D.exams.filter(e=>C(e.cid)?.tid===me).map(e=>{const used=D.att.some(a=>a.eid===e.id);return`<div class="card"><div class="row sp"><h2>${esc(e.title)}</h2>${badge(e.pub?['Published','ok']:['Draft','mu'])}</div><p class="mu">${esc(C(e.cid).name)} · ${e.qs.length} questions · ${total(e)} pts · ${e.min} min · pass ${e.pass}%</p><div class="row"><button class="btn" data-act="editexam" data-id="${e.id}" ${used?'disabled title="Exams with attempts are locked"':''}>Edit</button><button class="btn" data-act="pub" data-id="${e.id}" ${used&&e.pub?'disabled':''}>${e.pub?'Unpublish':'Publish'}</button><button class="btn dan" data-act="delexam" data-id="${e.id}">Delete</button></div></div>`}).join('')||empty('No exams yet','Create an exam, add questions, then publish it to a class.')}`}
function builder(){const d=draft,Q=d.edit!=null?d.qs[d.edit]:{type:d.lt||'mc',pts:d.lp||1,text:'',ch:[],ans:''};return`<h1>${d.id?'Edit exam':'New exam'}</h1><form class="card" data-form="exam" id="ef"><div class="row"><label style="flex:2">Title<input name="title" required maxlength="100" value="${esc(d.title)}"></label><label style="flex:1">Class<select name="cid" required>${myClasses().map(c=>`<option value="${c.id}" ${c.id===d.cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>
<div class="row"><label style="flex:1">Time limit (min)<input name="min" type="number" min="1" max="300" value="${d.min}"></label><label style="flex:1">Passing score (%)<input name="pass" type="number" min="0" max="100" value="${d.pass}"></label></div>
<label>Instructions<textarea name="ins" rows="2" maxlength="1000">${esc(d.ins)}</textarea></label><h2>Questions (${d.qs.length}, ${total(d)} pts)</h2>
${d.qs.map((q,i)=>`<div class="card"><div class="row sp"><b>${i+1}. ${esc(q.text)}</b><span class="mu">${{mc:'Multiple choice',tf:'True/False',id:'Identification',essay:'Essay'}[q.type]} · ${q.pts} pt</span></div>${q.type==='mc'?`<div class="mu">${q.ch.map((c,k)=>`${'ABCDEF'[k]}. ${esc(c)}${+q.ans===k+1?' ✓':''}`).join('<br>')}</div>`:q.type==='essay'?'':`<div class="mu">Answer: ${esc(q.ans)}</div>`}<div class="row" style="margin-top:8px"><button type="button" class="btn" data-act="qedit" data-i="${i}">Edit</button><button type="button" class="btn" data-act="qdup" data-i="${i}">Duplicate</button><button type="button" class="btn" data-act="qup" data-i="${i}" ${i?'':'disabled'}>Move up</button><button type="button" class="btn" data-act="qdown" data-i="${i}" ${i<d.qs.length-1?'':'disabled'}>Move down</button><button type="button" class="btn dan" data-act="qdel" data-i="${i}">Delete</button></div></div>`).join('')||'<p class="mu">No questions yet. Add your first one below.</p>'}
<div class="card" id="qf" style="background:var(--sh)"><h3>${d.edit!=null?'Edit question '+(d.edit+1):'Add question '+(d.qs.length+1)}</h3>
<div class="row"><label style="flex:1">Type<select id="qt">${[['mc','Multiple choice'],['tf','True or false'],['id','Identification'],['essay','Essay']].map(o=>`<option value="${o[0]}" ${o[0]===Q.type?'selected':''}>${o[1]}</option>`).join('')}</select></label><label style="width:90px">Points<input id="qp" type="number" min="1" value="${Q.pts}"></label></div>
<label>Question<textarea id="qx" rows="2" maxlength="500">${esc(Q.text)}</textarea></label>
<div data-sec="mc" ${Q.type==='mc'?'':'hidden'}><p class="mu">Type each choice, then select the correct one. Leave C or D empty for fewer choices.</p>${['A','B','C','D'].map((L,i)=>`<div class="row" style="flex-wrap:nowrap"><b style="width:22px">${L}.</b><input id="c${i}" value="${esc(Q.type==='mc'?Q.ch[i]||'':'')}" placeholder="Choice ${L}" aria-label="Choice ${L}" maxlength="200" style="flex:1"><label class="row" style="white-space:nowrap"><input type="radio" name="cr" value="${i+1}" ${Q.type==='mc'&&+Q.ans===i+1?'checked':''}>Correct</label></div>`).join('')}</div>
<div data-sec="tf" ${Q.type==='tf'?'':'hidden'}><p class="mu">Correct answer</p>${['True','False'].map(v=>`<label class="row"><input type="radio" name="tr" value="${v}" ${Q.type==='tf'&&Q.ans===v?'checked':''}>${v}</label>`).join('')}</div>
<div data-sec="id" ${Q.type==='id'?'':'hidden'}><label>Correct answer <span class="mu">(separate accepted answers with | )</span><input id="qa" value="${esc(Q.type==='id'?Q.ans:'')}" maxlength="200"></label></div>
<p class="mu" data-sec="essay" ${Q.type==='essay'?'':'hidden'}>Essays are graded by hand after the student submits.</p>
<div class="row"><button type="button" class="btn pri" data-act="qadd">${d.edit!=null?'Save question':'Add question'}</button>${d.edit!=null?'<button type="button" class="btn" data-act="qcancel">Cancel edit</button>':''}</div></div>
<div class="row"><button class="btn pri" name="go" value="draft">Save draft</button><button class="btn" name="go" value="pub">Save and publish</button><button type="button" class="btn" data-act="cancel">Cancel</button></div></form>`}
function subs(){const exs=D.exams.filter(e=>C(e.cid)?.tid===me);return`<h1>Monitoring & submissions</h1><p class="mu">Updates live when students act in another tab of this browser. Tab switches are context for review, never automatic penalties.</p>${exs.map(e=>{const c=C(e.cid);return`<div class="card"><h2>${esc(e.title)} <span class="mu">${esc(c.name)}</span></h2><div class="tw"><table><tr><th>Student</th><th>Status</th><th>Started</th><th>Time left</th><th>Tab switches</th><th>Score</th><th></th></tr>${c.sids.map(s=>{const a=att(e.id,s),left=a&&a.st==='in'?Math.max(0,Math.round((a.start+e.min*60000-now())/60000))+' min':'–',L=a?leaves(a):0;return`<tr><td>${esc(nm(s))}</td><td>${badge(status(a,e))}${L>=3?' '+badge(['Needs review','er']):''}</td><td>${a?fmt(a.start):'–'}</td><td>${left}</td><td>${L}</td><td>${a&&a.st!=='in'?(auto(a,e)+'/'+total(e)+(pendingEssay(a,e)?' (essay pending)':'')):'–'}</td><td>${a?`<button class="btn" data-act="review" data-id="${a.id}">Review</button>`:''}</td></tr>`}).join('')||'<tr><td colspan=7 class="mu">No students enrolled.</td></tr>'}</table></div></div>`}).join('')||empty('No exams to monitor','Publish an exam to see student activity.')}`}
function review(){const a=D.att.find(x=>x.id===sub),e=E(a.eid);return`<button class="btn" data-act="back">Back</button><h1 style="margin-top:12px">${esc(nm(a.sid))}: ${esc(e.title)}</h1><div class="card"><h2>Activity timeline</h2><ul><li>${fmt(a.start)}: Examination started</li>${a.ev.map(x=>`<li>${fmt(x.at)}: ${x.t==='leave'?'Left the exam window':x.t==='ret'?'Returned to the exam window':x.t==='ack'?'Acknowledged warning':esc(x.t)}</li>`).join('')}${a.end?`<li>${fmt(a.end)}: ${a.st==='expired'?'Time expired, auto-submitted':'Submitted'}</li>`:''}</ul><p>${leaves(a)} window departures. ${leaves(a)>=3?'<b class="er">Flagged for review.</b>':'Below the review threshold of 3.'}</p></div>
<form class="card" data-form="grade" data-id="${a.id}">${e.qs.map((q,i)=>`<div style="margin-bottom:12px"><b>${i+1}. ${esc(q.text)}</b> <span class="mu">(${q.pts} pt)</span><br>Answer: ${esc(q.type==='mc'&&a.ans[q.id]?'ABCDEF'[a.ans[q.id]-1]+'. '+q.ch[a.ans[q.id]-1]:a.ans[q.id]??'(blank)')}<br><span class="mu">Correct: ${q.type==='essay'?'manual grading':esc(q.type==='mc'?'ABCDEF'[q.ans-1]+'. '+q.ch[q.ans-1]:q.ans)}</span>${q.type==='essay'?`<label>Points awarded<input name="m_${q.id}" type="number" min="0" max="${q.pts}" value="${a.man?.[q.id]??''}"></label>`:''}</div>`).join('')}
<h2>Score: ${auto(a,e)} / ${total(e)}</h2><label>Feedback to student<textarea name="fb" rows="2">${esc(a.fb||'')}</textarea></label><div class="row"><button class="btn pri" name="rel" value="0">Save grades</button><button class="btn" name="rel" value="1">${a.rel?'Save (released)':'Save and release to student'}</button></div></form>`}
function stuExams(){return`<h1>Examinations</h1>${myExams().map(e=>{const a=att(e.id,me);return`<div class="card"><div class="row sp"><h2>${esc(e.title)}</h2>${badge(status(a,e))}</div><p class="mu">${esc(C(e.cid).name)} · ${e.qs.length} questions · ${e.min} min</p><p>${esc(e.ins)}</p>${!a?`<button class="btn pri" data-act="start" data-id="${e.id}">Start exam</button>`:a.st==='in'?`<button class="btn pri" data-act="resume" data-id="${a.id}">Resume exam</button>`:'<span class="mu">Submitted. Check My grades once released.</span>'}</div>`}).join('')||empty('No exams available','Published exams from your classes show up here.')}`}
function takeView(){const a=ex.a,e=E(a.eid),q=e.qs[ex.i],v=a.ans[q.id]??'';
return`<div class="card row sp"><div><h1 style="margin:0">${esc(e.title)}</h1><span class="mu">${esc(nm(C(e.cid).tid))} · ${esc(C(e.cid).name)}</span></div><div class="timer" id="tm" aria-label="Time remaining"></div></div>
<div class="card row">${e.qs.map((x,i)=>`<button class="btn qn ${a.ans[x.id]?'a':''} ${i===ex.i?'c':''}" data-act="goto" data-i="${i}" aria-label="Question ${i+1}, ${a.ans[x.id]?'answered':'unanswered'}">${i+1}</button>`).join('')}</div>
<div class="card"><p class="mu">Question ${ex.i+1} of ${e.qs.length} · ${q.pts} pt</p><h2 style="white-space:pre-wrap">${esc(q.text)}</h2>
${q.type==='mc'?q.ch.map((c,i)=>`<label class="opt"><input type="radio" name="q" data-q="${q.id}" value="${i+1}" ${v==i+1?'checked':''}>&nbsp;<b>${'ABCDEF'[i]}.</b>&nbsp;${esc(c)}</label>`).join(''):q.type==='tf'?['True','False'].map(c=>`<label class="opt"><input type="radio" name="q" data-q="${q.id}" value="${c}" ${v===c?'checked':''}>${c}</label>`).join(''):q.type==='id'?`<label>Your answer<input data-q="${q.id}" value="${esc(v)}" autocomplete="off"></label>`:`<label>Your answer<textarea data-q="${q.id}" rows="8">${esc(v)}</textarea></label>`}
<p class="mu" id="sv">Answers save automatically.</p></div>
<div class="row sp"><button class="btn" data-act="prev" ${ex.i?'':'disabled'}>Previous</button>${ex.i<e.qs.length-1?'<button class="btn pri" data-act="next">Next</button>':'<span></span>'}<button class="btn pri" data-act="submit">Submit exam</button></div>`}
function startTimer(){clearInterval(tm);const a=ex.a,e=E(a.eid);const tick=()=>{const l=a.start+e.min*60000-now();if(l<=0){finish('expired');return}const el=$('#tm');if(el){el.classList.toggle('urgent',l<60000);const s=Math.floor(l/1000);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}};tick();tm=setInterval(tick,1000)}
function finish(r){if(!ex)return;const a=ex.a;a.st=r==='expired'?'expired':'sub';a.end=now();save();clearInterval(tm);ex=null;closeM();view='exams';render();toast(r==='expired'?'Time is up. Your answers were submitted.':'Exam submitted.')}
function open(a){const e=E(a.eid);if(a.start+e.min*60000<=now()&&a.st==='in'){ex={a,i:0};finish('expired');return}ex={a,i:0};render();startTimer()}
function leave(){if(!ex||away)return;away=true;ex.a.ev.push({t:'leave',at:now()});save()}
function back(){if(!ex||!away)return;away=false;const a=ex.a;a.ev.push({t:'ret',at:now()});save();const n=leaves(a);modal(`<h2>Attention!</h2><p>You have left the examination window${n>1?' ('+n+' times)':''}.</p><p>This activity has been recorded and may be reviewed by your teacher. Please remain on the examination page while completing your exam.</p>${n>=3?'<p class="er"><b>Your exam has been flagged for teacher review.</b> This does not change your score.</p>':n===2?'<p class="wa">This is an additional warning.</p>':''}<button class="btn pri" data-act="ack">I understand, continue</button>`)}
document.addEventListener('visibilitychange',()=>document.hidden?leave():(document.hasFocus()&&back()));
addEventListener('blur',()=>setTimeout(leave,50));addEventListener('focus',()=>{if(!document.hidden)back()});
addEventListener('storage',e=>{if(e.key!==K||ex||draft)return;try{D=JSON.parse(e.newValue)||D}catch(x){}if(me&&!user()){me=null}render()});
function sync(){const f=$('#ef');if(!f||!draft)return;const g=n=>f.elements[n].value;Object.assign(draft,{title:g('title'),cid:g('cid'),min:+g('min')||30,pass:+g('pass')||0,ins:g('ins')})}
document.addEventListener('input',e=>{const q=e.target.dataset?.q;if(q&&ex){ex.a.ans[q]=e.target.value;save();const s=$('#sv');if(s)s.textContent='Saved '+new Date().toLocaleTimeString()}});
document.addEventListener('change',e=>{const q=e.target.dataset?.q;if(q&&ex){ex.a.ans[q]=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.id==='qt')document.querySelectorAll('[data-sec]').forEach(x=>x.hidden=x.dataset.sec!==e.target.value)});
document.addEventListener('change',e=>{if(e.target.id!=='jn')return;const s=$('#js'),L=D.classes.filter(c=>c.name===e.target.value);s.innerHTML='<option value="">Select subject…</option>'+L.map(c=>`<option value="${c.id}">${esc(c.sub||'No subject')} — ${esc(nm(c.tid))}${c.sids.includes(me)?' (joined)':''}</option>`).join('');s.disabled=!L.length});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.closest('#qf')){e.preventDefault();document.querySelector('[data-act=qadd]')?.click()}});
async function uploadList(inputId){const files=[...(document.getElementById(inputId)?.files||[])];if(!files.length)return[];if(!AS)throw new Error('File storage permission is not enabled for this page. Enable the hosting platform’s file-upload permission and reload.');if(files.length>5||files.some(f=>f.size>10*1024*1024))throw new Error('Choose up to 5 files, maximum 10 MB each.');const out=[];for(const f of files){const r=await AS.upload(f);if(!r?.url)throw new Error('The storage service did not return a file link.');out.push({name:f.name,url:r.url,type:r.contentType||f.type,size:r.sizeBytes||f.size})}return out}
document.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target,k=f.dataset.form,F=new FormData(f),g=n=>(F.get(n)||'').toString().trim();
 if(k==='login'){const u=D.users.find(x=>x.u===g('u').toLowerCase());if(!u||u.h!==await hs(g('p')))return toast('Wrong username or password.');if(u.on===false)return toast('This account is disabled. Ask the administrator.');me=u.id;try{sessionStorage.setItem('me',me)}catch(e){}view='dash';render()}
 if(k==='reg'){const un=g('u').toLowerCase(),role=g('role')==='teacher'?'teacher':'student';if(D.users.some(x=>x.u===un))return toast('That username is taken.');if(role==='teacher'&&(!g('inv')||g('inv').toUpperCase()!==(D.cfg.find(c=>c.id==='invite')?.code||'')))return toast('Teacher accounts need a valid invite code.');const u={id:uid(),u:un,name:g('name'),role,h:await hs(g('p'))};D.users.push(u);if(role==='student'&&g('code')){const c=C(g('code'));if(c)c.sids.push(u.id)}save();me=u.id;try{sessionStorage.setItem('me',me)}catch(e){}view='dash';render()}
 if(k==='class'){if(D.classes.some(c=>c.tid===me&&c.name.trim().toLowerCase()===g('n').toLowerCase()&&(c.sub||'').trim().toLowerCase()===g('s').toLowerCase()))return toast('You already have a class with that name and subject.');D.classes.push({id:uid(),tid:me,name:g('n'),sub:g('s'),code:'',sids:[]});save();render();toast('Class created.')}
 if(k==='join'){const c=C(g('cid'));if(!c)return toast('Select a class name and subject first.');if(!c.sids.includes(me))c.sids.push(me);save();render();toast('Joined '+c.name+'.')}
 if(k==='mypw'){user().h=await hs(g('p'));save();f.reset();toast('Password updated.')}
 if(k==='mkteacher'){const un=g('u').toLowerCase();if(D.users.some(x=>x.u===un))return toast('That username is taken.');D.users.push({id:uid(),u:un,name:g('name'),role:'teacher',h:await hs(g('p'))});save();render();toast('Teacher account created.')}
 if(k==='ann'){let at=[];try{at=await uploadList('af')}catch(e){return toast('Upload failed: '+e.message)}D.ann.push({id:uid(),cid:g('c'),tid:me,title:g('t'),body:g('b'),pin:!!F.get('pin'),at:now(),att});save();render();toast('Announcement posted.')}
 if(k==='activity'){let at=[];try{at=await uploadList('xf')}catch(e){return toast('Upload failed: '+e.message)}D.activities.push({id:uid(),cid:g('c'),tid:me,title:g('t'),body:g('b'),due:g('due'),at:now(),att});save();render();toast('Activity published for students.')}
 if(k==='work'){let at=[];try{at=await uploadList('wf')}catch(e){return toast('Upload failed: '+e.message)}const aid=f.dataset.aid,old=D.work.findIndex(w=>w.aid===aid&&w.sid===me);if(old>=0)return toast('You already submitted this activity.');D.work.push({id:uid(),aid,sid:me,text:g('text'),att,at:now()});save();render();toast('Your activity was submitted.')}
 if(k==='exam'){sync();const d=draft;delete d.edit;delete d.lt;delete d.lp;if(!d.qs.length)return toast('Add at least one question.');d.pub=ev.submitter?.value==='pub';if(d.id)D.exams[D.exams.findIndex(e=>e.id===d.id)]=d;else{d.id=uid();D.exams.push(d)}save();draft=null;render();toast(d.pub?'Exam published.':'Draft saved.')}
 if(k==='grade'){const a=D.att.find(x=>x.id===f.dataset.id),e=E(a.eid);a.man=a.man||{};e.qs.filter(q=>q.type==='essay').forEach(q=>{const v=F.get('m_'+q.id);if(v!==''&&v!==null)a.man[q.id]=Math.min(q.pts,Math.max(0,+v))});a.fb=g('fb');if(ev.submitter?.value==='1')a.rel=true;save();render();toast(a.rel?'Grades saved and released.':'Grades saved.')}
});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const d=b.dataset,a=d.act;
 if(a==='tab'){authTab=d.v;render()}
 if(a==='nav'){view=d.v;sub=null;draft=null;render()}
 if(a==='theme'){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dk?'light':'dark'}
 if(a==='out'){if(ex)return toast('Submit your exam before logging out.');me=null;try{sessionStorage.removeItem('me')}catch(e){}render()}
 if(a==='rmstu'){const c=C(d.c);c.sids=c.sids.filter(s=>s!==d.s);save();render()}
 if(a==='delann'){D.ann=D.ann.filter(x=>x.id!==d.id);save();render()}
 if(a==='delactivity'){D.activities=D.activities.filter(x=>x.id!==d.id);D.work=D.work.filter(x=>x.aid!==d.id);save();render()}
 if(a==='newexam'){if(!myClasses().length)return toast('Create a class first.');draft={title:'',cid:myClasses()[0].id,min:30,pass:60,ins:'',qs:[],pub:false};render()}
 if(a==='editexam'){draft=JSON.parse(JSON.stringify(E(d.id)));render()}
 if(a==='cancel'){draft=null;render()}
 if(a==='pub'){const e=E(d.id);if(!e.pub&&!e.qs.length)return toast('Add questions first.');e.pub=!e.pub;save();render();toast(e.pub?'Exam published.':'Exam unpublished.')}
 if(a==='delexam'){modal(`<h2>Delete this exam?</h2><p>Its attempts and grades will be removed too.</p><div class="row"><button class="btn dan" data-act="delok" data-id="${d.id}">Delete</button><button class="btn" data-act="closem">Cancel</button></div>`)}
 if(a==='delok'){D.exams=D.exams.filter(e=>e.id!==d.id);D.att=D.att.filter(x=>x.eid!==d.id);save();closeM();render()}
 if(a==='closem')closeM();
 if(a==='tog'){const u=U(d.id);u.on=u.on===false;save();render()}
 if(a==='rp')modal(`<h2>Reset password for ${esc(nm(d.id))}</h2><label>New password<input id="npw" minlength="6" autocomplete="off"></label><div class="row"><button class="btn pri" data-act="rpok" data-id="${d.id}">Save password</button><button class="btn" data-act="closem">Cancel</button></div>`)

 if(a==='qup'){sync();draft.edit=null;const i=+d.i;[draft.qs[i-1],draft.qs[i]]=[draft.qs[i],draft.qs[i-1]];render()}

 if(a==='resume')open(D.att.find(x=>x.id===d.id));

 if(a==='ack'){ex.a.ev.push({t:'ack',at:now()});save();closeM()}
 if(a==='submit'){const e=E(ex.a.eid),u=e.qs.filter(q=>!ex.a.ans[q.id]).length;modal(`<h2>Submit your exam?</h2><p>${u?`You have <b>${u}</b> unanswered question${u>1?'s':''}.`:'All questions are answered.'} You can’t change your answers after submitting.</p><div class="row"><button class="btn pri" data-act="subok">Submit</button><button class="btn" data-act="closem">Keep working</button></div>`)}
 if(a==='subok')finish('sub');
});

 try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}
 if(me&&user()&&!isT()&&D.att.some(x=>x.sid===me&&x.st==='in'))view='exams';
 render();initBg();
 try{DB=await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))])}catch(e){DB=null}

 COLS.forEach(n=>{try{DB.collection(n).onSnapshot(s=>{if(n==='att'&&ex)return;const arr=s.docs.map(d=>d.data());if(!LD[n]){LD[n]=1;if(!arr.length){push();return}}
  SYN[n]={};arr.forEach(o=>SYN[n][o.id]=JSON.stringify(o));D[n]=arr;try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}

  if(me&&!ex&&!draft&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName))render()},()=>{})}catch(e){}});
